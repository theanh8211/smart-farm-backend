[alembic]
# Đường dẫn đến thư mục chứa migration scripts
script_location = alembic

# Template tên file migration
file_template = %%(year)d%%(month).2d%%(day)d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# URL kết nối database (sẽ override bằng environment variable trong Docker)
sqlalchemy.url = postgresql+asyncpg://postgres:123456@db/postgres

# Các tùy chọn khác (tùy chọn)
prepend_sys_path = .
version_path_separator = os  # Use os.pathsep for multiple versions

[post_write_hooks]
# Các hook sau khi viết migration (nếu cần)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = sys.stderr
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S